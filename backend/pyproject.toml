[project]
name = "argus-prism-backend"
version = "3.0.0"
description = "ARGUS-PRISM V3 backend — mule detection intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.2",
    "neo4j>=5.26",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "pyotp>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "xgboost>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "schemathesis>=3.36",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI's Depends() in argument defaults is the framework idiom, not a bug.
# UP042: (str, Enum) is intentional for JSON-serialisable role/permission enums.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
