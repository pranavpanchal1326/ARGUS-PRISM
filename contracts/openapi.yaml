openapi: 3.1.0
info:
  title: ARGUS-PRISM API
  version: 3.0.0
  description: |
    Pre-crime Intelligence System for Mule Detection — the single source of truth.

    **Conventions (enforced by CI, no exceptions):**
    - Success responses are enveloped: `{ "data": ..., "meta": {...} }`.
    - List responses put pagination in `meta`: `{ "cursor": ..., "total": ... }`.
    - Errors are RFC-7807 `application/problem+json`.
    - No response consumed by the UI ever contains key material (Law 3).
  contact:
    name: ARGUS-PRISM Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: /
    description: Same-origin (behind reverse proxy)

tags:
  - name: Health
  - name: Auth
  - name: Alerts
  - name: Stream
  - name: Metrics
  - name: Simulator

paths:
  # ─────────────────────────────── Health ───────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness + dependency status
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up; reports each dependency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  # ─────────────────────────────── Auth ─────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Email + password → MFA challenge
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credentials valid; MFA required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaChallenge" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/oauth/google:
    post:
      tags: [Auth]
      summary: Google OAuth code exchange → MFA challenge
      operationId: oauthGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: OAuth valid; MFA required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaChallenge" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Begin TOTP enrolment → otpauth provisioning URI (rendered as QR client-side)
      operationId: mfaEnroll
      description: |
        Returns the `otpauth://` URI exactly once. The secret is never logged and
        never re-displayed. Regenerating produces a **different** secret every time.
      responses:
        "200":
          description: Provisioning URI issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaEnrolment" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: TOTP code + mfa_token → access + refresh JWT
      operationId: mfaVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: MFA verified; tokens issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair (old refresh token revoked).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      operationId: logout
      responses:
        "204": { description: Session revoked. }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current profile, role, and active sessions
      operationId: getMe
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a specific session
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Alerts ───────────────────────────────
  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: Cursor-paginated, server-sorted alert queue
      operationId: listAlerts
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AlertStatus" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: sort, in: query, schema: { type: string, enum: [score_desc, score_asc, newest, sla_soonest], default: sla_soonest } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertListEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/alerts/{id}:
    get:
      tags: [Alerts]
      summary: One alert
      operationId: getAlert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Alert detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Alerts]
      summary: Acknowledge / assign / resolve / mark false-positive
      operationId: updateAlert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertUpdate" }
      responses:
        "200":
          description: Updated alert.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/alerts/{id}/escalate:
    post:
      tags: [Alerts]
      summary: Escalate an alert to MLRO
      operationId: escalateAlert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: Escalated alert.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Accounts ─────────────────────────────
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: Account lookup (cursor-paginated, server-sorted)
      operationId: listAccounts
      parameters:
        - { name: query, in: query, schema: { type: string }, description: "Match account ref or holder." }
        - { name: risk_tier, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of account summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountListEnvelope" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Account profile (PII masked by role)
      operationId: getAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Account profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/accounts/{id}/score-history:
    get:
      tags: [Accounts]
      summary: WarmthScore trajectory + SHAP per point
      operationId: getScoreHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Score history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ScorePoint" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/accounts/{id}/transactions:
    get:
      tags: [Accounts]
      summary: Account transactions (cursor-paginated)
      operationId: getAccountTransactions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionListEnvelope" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/accounts/{id}/devices:
    get:
      tags: [Accounts]
      summary: IMEI/SIM event history
      operationId: getAccountDevices
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Device events.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceEvent" }

  /api/v1/accounts/{id}/signals:
    get:
      tags: [Accounts]
      summary: Current S1–S6 signal breakdown
      operationId: getAccountSignals
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signal breakdown.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignalBreakdown" }

  /api/v1/accounts/{id}/actions:
    post:
      tags: [Accounts]
      summary: "Freeze / restrict / KYC-review (MLRO; server re-checks role)"
      operationId: accountAction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountAction" }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Network Graph ────────────────────────
  /api/v1/graph/neighborhood/{account_id}:
    get:
      tags: [Graph]
      summary: Force-directed neighborhood subgraph
      operationId: getNeighborhood
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string } }
        - { name: hops, in: query, schema: { type: integer, minimum: 1, maximum: 4, default: 3 } }
      responses:
        "200":
          description: Nodes + edges within N hops.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Graph" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/graph/patterns/{type}:
    get:
      tags: [Graph]
      summary: Detected layering / round-trip / structuring subgraphs
      operationId: getPatterns
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [round_trip, layering, structuring, velocity, any] } }
      responses:
        "200":
          description: Matching pattern subgraphs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PatternMatch" }

  /api/v1/graph/freeze-cluster:
    post:
      tags: [Graph]
      summary: "Freeze a selected node set (MLRO); propagates taint"
      operationId: freezeCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties:
                account_ids: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        "200":
          description: Freeze result + taint summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FreezeResult" }
        "403": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Recruiter Map ────────────────────────
  /api/v1/recruiters:
    get:
      tags: [Recruiter]
      summary: Detected coordinators + campaign scale class
      operationId: listRecruiters
      responses:
        "200":
          description: Detected recruiters.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Recruiter" }

  /api/v1/recruiters/{id}/campaign:
    get:
      tags: [Recruiter]
      summary: Full fan-out subgraph for a recruiter
      operationId: getRecruiterCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Campaign subgraph.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RecruiterCampaign" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/recruiters/{id}/freeze-campaign:
    post:
      tags: [Recruiter]
      summary: "One-click network freeze (MLRO); propagates taint"
      operationId: freezeCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Freeze result + taint summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FreezeResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Cases ────────────────────────────────
  /api/v1/cases:
    get:
      tags: [Cases]
      summary: List cases
      operationId: listCases
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CaseStatus" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseListEnvelope" }
    post:
      tags: [Cases]
      summary: Open a case (optionally from an alert)
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreate" }
      responses:
        "201":
          description: Created case.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Case" }

  /api/v1/cases/{id}:
    get:
      tags: [Cases]
      summary: One case
      operationId: getCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Case detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Case" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Cases]
      summary: Transition a case (state change is audit-logged)
      operationId: updateCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/CaseStatus" }
                title: { type: string }
      responses:
        "200":
          description: Updated case.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Case" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/cases/{id}/notes:
    post:
      tags: [Cases]
      summary: Add an analyst note
      operationId: addCaseNote
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Note added.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CaseNote" }

  /api/v1/cases/{id}/evidence:
    post:
      tags: [Cases]
      summary: Attach a graph snapshot / timeline export
      operationId: attachEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, ref]
              properties:
                kind: { type: string, enum: [graph_snapshot, timeline_export, note] }
                ref: { type: string }
                label: { type: string }
      responses:
        "200":
          description: Updated case.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Case" }

  /api/v1/cases/{id}/activity:
    get:
      tags: [Cases]
      summary: Full state-transition history
      operationId: getCaseActivity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Activity log.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CaseActivity" }

  # ─────────────────────────────── AutoSTR ──────────────────────────────
  /api/v1/autostr/{case_id}/generate:
    post:
      tags: [AutoSTR]
      summary: Generate the three evidence packages (async job)
      operationId: generateStr
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StrJob" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/autostr/jobs/{job_id}:
    get:
      tags: [AutoSTR]
      summary: "Job status: ASSEMBLING → SIGNING → SEALED"
      operationId: getStrJob
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StrJob" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/autostr/{case_id}/packages:
    get:
      tags: [AutoSTR]
      summary: List sealed packages (with document fingerprint chip)
      operationId: listPackages
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Packages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PackageSummary" }

  /api/v1/autostr/packages/{id}/download:
    get:
      tags: [AutoSTR]
      summary: Stream a package file (server-side authz; audit-logged)
      operationId: downloadPackage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file stream.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/autostr/packages/{id}/approve:
    post:
      tags: [AutoSTR]
      summary: "MLRO approval → mark submitted (countersignature)"
      operationId: approvePackage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved package.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PackageSummary" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── Compliance ───────────────────────────
  /api/v1/audit:
    get:
      tags: [Compliance]
      summary: Append-only, HMAC-chained audit entries
      operationId: getAudit
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of audit entries (no key material).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListEnvelope" }

  /api/v1/audit/verify:
    get:
      tags: [Compliance]
      summary: Chain-integrity check → "Ledger intact ✓ (N entries)"
      operationId: verifyAudit
      responses:
        "200":
          description: Verification result (boolean + count only, never the key).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LedgerVerification" }

  /api/v1/compliance/reports:
    get:
      tags: [Compliance]
      summary: Scheduled report registry
      operationId: getReports
      responses:
        "200":
          description: Report registry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ComplianceReport" }

  /api/v1/compliance/fairness:
    get:
      tags: [Compliance]
      summary: Bias / false-positive metrics by segment (DPDP story)
      operationId: getFairness
      responses:
        "200":
          description: Fairness metrics.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Fairness" }

  # ─────────────────────────────── Administration ───────────────────────
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users (SYS_ADMIN)
      operationId: listUsers
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Admin]
      summary: Invite a user (SYS_ADMIN; no public signup)
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInvite" }
      responses:
        "201":
          description: Invited user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Change role / disable / force MFA reset (SYS_ADMIN)
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/health:
    get:
      tags: [Admin]
      summary: Service status strip (SYS_ADMIN)
      operationId: adminHealth
      responses:
        "200":
          description: Per-service status lamps.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string, enum: [up, down, disabled] }
                        detail: { type: string }
        "403": { $ref: "#/components/responses/Problem" }

  # ─────────────────────────────── PRISM Assistant ──────────────────────
  /api/v1/assistant/suggestions:
    get:
      tags: [Assistant]
      summary: Per-screen canned prompts (3 chips)
      operationId: assistantSuggestions
      parameters:
        - { name: screen, in: query, schema: { type: string } }
      responses:
        "200":
          description: Suggestion chips.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { type: string } }

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: Ask the on-prem assistant (SSE streamed reply)
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                screen_context: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "text/event-stream of reply tokens; degrades to an 'unavailable' event when Ollama is offline."
          content:
            text/event-stream:
              schema: { type: string }

  # ─────────────────────────────── Stream / Metrics ─────────────────────
  /api/v1/feed/recent:
    get:
      tags: [Stream]
      summary: Replay buffer for page load / WS backfill
      operationId: getRecentFeed
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after_id, in: query, schema: { type: integer }, description: "Return events with id greater than this (backfill)." }
      responses:
        "200":
          description: Recent events (monotonic ids).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListEnvelope" }

  /api/v1/metrics/pulse:
    get:
      tags: [Metrics]
      summary: Rolling operational KPIs
      operationId: getPulse
      responses:
        "200":
          description: Live KPIs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Pulse" }

  /api/v1/stream:
    get:
      tags: [Stream]
      summary: "WebSocket: multiplexed event stream (documented here for the contract)"
      operationId: stream
      description: |
        Upgrade to WebSocket. Client subscribes to channels
        (`transactions`, `alerts`, `scores`, `metrics`). Server pushes
        `Event` objects with monotonic ids; gaps are backfilled via
        `/feed/recent?after_id=`.
      responses:
        "101": { description: Switching Protocols (WebSocket). }

  # ─────────────────────────────── Simulator (SYS_ADMIN) ────────────────
  /api/v1/sim/scenario:
    post:
      tags: [Simulator]
      summary: Load / start / pause a scenario (SYS_ADMIN only)
      operationId: controlScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioControl" }
      responses:
        "200":
          description: Simulator status after the command.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SimStatus" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/sim/status:
    get:
      tags: [Simulator]
      summary: Current simulator status
      operationId: getSimStatus
      responses:
        "200":
          description: Simulator status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SimStatus" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Problem:
      description: RFC-7807 problem+json error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ── Envelope + error ──────────────────────────────────────
    Meta:
      type: object
      properties:
        cursor: { type: [string, "null"], description: "Opaque cursor for the next page; null when exhausted." }
        total: { type: [integer, "null"] }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Machine-readable error code, e.g. mfa_required, rate_limited." }

    # ── Health ────────────────────────────────────────────────
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, version, dependencies]
          properties:
            status: { type: string, enum: [ok, degraded] }
            version: { type: string }
            dependencies:
              type: object
              additionalProperties:
                type: object
                properties:
                  status: { type: string, enum: [up, down, disabled] }
                  detail: { type: string }

    # ── Auth ──────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }

    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token, mfa_enrolled]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string, description: "Short-lived token to bind the MFA step." }
        mfa_enrolled: { type: boolean, description: "False on first login → client must enrol first." }

    MfaEnrolment:
      type: object
      required: [otpauth_uri]
      properties:
        otpauth_uri:
          type: string
          description: "otpauth:// provisioning URI. Appears in exactly this one response; never re-displayed."

    MfaVerifyRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: "Access token TTL in seconds." }

    Role:
      type: string
      enum: [MLRO, FRAUD_ANALYST, COMPLIANCE_AUDITOR, SYS_ADMIN]

    Me:
      type: object
      required: [id, email, name, role, mfa_active, sessions]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        mfa_active: { type: boolean }
        mfa_active_since: { type: [string, "null"], format: date-time }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    Session:
      type: object
      required: [id, device, ip, created_at, current]
      properties:
        id: { type: string }
        device: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }

    # ── Alerts ────────────────────────────────────────────────
    Severity: { type: string, enum: [CLEAN, WARMING, HOT, CRITICAL, IMMINENT] }
    AlertStatus: { type: string, enum: [NEW, ACKNOWLEDGED, ASSIGNED, ESCALATED, RESOLVED, FALSE_POSITIVE] }

    ShapSignal:
      type: object
      required: [code, label, contribution]
      properties:
        code: { type: string, example: S3 }
        label: { type: string, example: "Round-trip ratio 0.94" }
        contribution: { type: number, description: "Warmth points contributed." }

    Alert:
      type: object
      required: [id, account_ref, warmth_score, severity, status, top_signals, first_signal_at, taint_linked]
      properties:
        id: { type: string }
        account_ref: { type: string, description: "Masked account reference (PII-safe)." }
        warmth_score: { type: number, minimum: 0, maximum: 100 }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/AlertStatus" }
        top_signals:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/ShapSignal" }
        first_signal_at: { type: string, format: date-time }
        sla_deadline: { type: [string, "null"], format: date-time, description: "STR filing deadline (PMLA §12) — the ticking clock." }
        taint_linked: { type: boolean }
        assignee: { type: [string, "null"] }
        case_id: { type: [string, "null"] }

    AlertListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        meta: { $ref: "#/components/schemas/Meta" }

    AlertUpdate:
      type: object
      properties:
        action: { type: string, enum: [acknowledge, assign, resolve, mark_false_positive] }
        assignee: { type: string }
        note: { type: string }

    # ── Stream / metrics ──────────────────────────────────────
    Event:
      type: object
      required: [id, type, ts, payload]
      properties:
        id: { type: integer, description: "Monotonic event id." }
        type:
          type: string
          enum: [transaction.posted, account.created, device.registered, kyc.updated, alert.raised, score.updated]
        ts: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    EventListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        meta: { $ref: "#/components/schemas/Meta" }

    Pulse:
      type: object
      required: [tx_per_sec, active_alerts, accounts_watched, avg_score, updated_at]
      properties:
        tx_per_sec: { type: number }
        active_alerts: { type: integer }
        accounts_watched: { type: integer }
        avg_score: { type: number }
        updated_at: { type: string, format: date-time }

    # ── Accounts ──────────────────────────────────────────────
    AccountSummary:
      type: object
      required: [id, account_ref, holder, warmth_score, severity, status, tainted]
      properties:
        id: { type: string }
        account_ref: { type: string, description: "Masked reference for lists." }
        holder: { type: string, description: "Holder name, masked unless the role may view PII." }
        branch: { type: string }
        segment: { type: string }
        warmth_score: { type: number }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        tainted: { type: boolean }

    Account:
      allOf:
        - $ref: "#/components/schemas/AccountSummary"
        - type: object
          required: [kyc_status, response_tier, opened_at, last_active]
          properties:
            ifsc: { type: string }
            kyc_status: { type: string }
            status_reason: { type: [string, "null"] }
            response_tier: { type: integer }
            taint_score: { type: number }
            opened_at: { type: string, format: date-time }
            last_active: { type: string, format: date-time }
            pii_masked: { type: boolean, description: "True when the caller's role only sees masked PII." }
            top_signals:
              type: array
              items: { $ref: "#/components/schemas/ShapSignal" }

    AccountStatus:
      type: string
      enum: [ACTIVE, WATCH, KYC_HOLD, RESTRICTED, FROZEN]

    AccountListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountSummary" }
        meta: { $ref: "#/components/schemas/Meta" }

    ScorePoint:
      type: object
      required: [ts, score, severity]
      properties:
        ts: { type: string, format: date-time }
        score: { type: number }
        severity: { $ref: "#/components/schemas/Severity" }
        shap:
          type: array
          items: { $ref: "#/components/schemas/ShapSignal" }

    AccountTransaction:
      type: object
      required: [id, ts, amount, direction, channel]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        counterparty_ref: { type: [string, "null"], description: "Masked counterparty, or null if external." }
        amount: { type: number }
        direction: { type: string, enum: [IN, OUT] }
        channel: { type: string }
        description: { type: [string, "null"] }

    TransactionListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountTransaction" }
        meta: { $ref: "#/components/schemas/Meta" }

    DeviceEvent:
      type: object
      required: [imei, event_type, registered_at]
      properties:
        imei: { type: string, description: "Masked IMEI (last 4 shown)." }
        event_type: { type: string }
        registered_at: { type: string, format: date-time }

    SignalBreakdown:
      type: object
      required: [score, signals, shap]
      properties:
        score: { type: number }
        signals:
          type: object
          additionalProperties: { type: number }
          description: "Raw S1–S6 values in [0,1]."
        shap:
          type: array
          items: { $ref: "#/components/schemas/ShapSignal" }

    AccountAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [freeze, restrict, kyc_review, unfreeze] }
        reason: { type: string }

    # ── Graph ─────────────────────────────────────────────────
    GraphNode:
      type: object
      required: [id, account_ref, warmth_score, severity, tainted]
      properties:
        id: { type: string }
        account_ref: { type: string }
        holder: { type: string }
        warmth_score: { type: number }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        tainted: { type: boolean }
        is_recruiter: { type: boolean }

    GraphEdge:
      type: object
      required: [source, target, value, count]
      properties:
        source: { type: string }
        target: { type: string }
        value: { type: number, description: "Summed transaction value (edge weight)." }
        count: { type: integer }

    Graph:
      type: object
      required: [root, nodes, edges]
      properties:
        root: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

    PatternMatch:
      type: object
      required: [anchor, anchor_id, severity, nodes, edges]
      properties:
        anchor: { type: string }
        anchor_id: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        warmth_score: { type: number }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

    FreezeResult:
      type: object
      required: [frozen, tainted]
      properties:
        frozen: { type: integer, description: "Accounts frozen." }
        tainted: { type: integer, description: "Downstream accounts tainted by propagation." }
        account_refs: { type: array, items: { type: string } }

    # ── Recruiter ─────────────────────────────────────────────
    Recruiter:
      type: object
      required: [id, account_ref, downstream_count, scale_class]
      properties:
        id: { type: string }
        account_ref: { type: string }
        holder: { type: string }
        branch: { type: string }
        warmth_score: { type: number }
        downstream_count: { type: integer }
        total_distributed: { type: number }
        scale_class:
          type: string
          enum: [FACILITATOR, COORDINATOR, INDUSTRIAL_ORCHESTRATOR, NATIONAL_SYNDICATE]
        campaign: { type: [string, "null"] }

    RecruiterCampaign:
      type: object
      required: [recruiter, mule_ids, nodes, edges]
      properties:
        recruiter:
          type: object
          properties:
            id: { type: string }
            account_ref: { type: string }
            scale_class: { type: string }
            downstream_count: { type: integer }
        mule_ids: { type: array, items: { type: string } }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

    # ── Cases ─────────────────────────────────────────────────
    CaseStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, PENDING_MLRO, CLOSED_CONFIRMED_MULE, CLOSED_FALSE_POSITIVE]

    CaseCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        account_ids: { type: array, items: { type: string } }
        alert_id: { type: string, description: "Open from an alert (links account + alert)." }

    CaseNote:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: string }
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CaseActivity:
      type: object
      required: [actor, action, at]
      properties:
        actor: { type: string }
        action: { type: string }
        from_status: { type: [string, "null"] }
        to_status: { type: [string, "null"] }
        at: { type: string, format: date-time }

    Case:
      type: object
      required: [id, title, status, account_ids, created_by, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        account_ids: { type: array, items: { type: string } }
        alert_ids: { type: array, items: { type: string } }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        notes: { type: array, items: { $ref: "#/components/schemas/CaseNote" } }

    CaseListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Case" } }
        meta: { $ref: "#/components/schemas/Meta" }

    # ── AutoSTR ───────────────────────────────────────────────
    StrJob:
      type: object
      required: [id, case_id, status, created_at]
      properties:
        id: { type: string }
        case_id: { type: string }
        status: { type: string, enum: [ASSEMBLING, SIGNING, SEALED, FAILED] }
        created_at: { type: string, format: date-time }
        package_ids: { type: array, items: { type: string } }
        error: { type: [string, "null"] }

    PackageSummary:
      type: object
      required: [id, type, filename, fingerprint, generated_at, status]
      properties:
        id: { type: string }
        type: { type: string, enum: [FIU_STR_XML, CBI_PDF, RBI_JSON] }
        filename: { type: string }
        # "Document fingerprint": last 8 chars of the content SHA-256. NOT key material.
        fingerprint: { type: string, minLength: 8, maxLength: 8 }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [SEALED, SUBMITTED] }
        approved_by: { type: [string, "null"] }
        approved_at: { type: [string, "null"], format: date-time }

    # ── Compliance ────────────────────────────────────────────
    AuditRecord:
      type: object
      required: [seq, at, actor, action, target, fingerprint]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
        fingerprint: { type: string, description: "Last 8 chars of the entry hash (chain marker, not key material)." }

    AuditListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
        meta: { $ref: "#/components/schemas/Meta" }

    LedgerVerification:
      type: object
      required: [intact, entries]
      properties:
        intact: { type: boolean }
        entries: { type: integer }
        broken_at: { type: [integer, "null"] }

    ComplianceReport:
      type: object
      required: [id, name, cadence, last_generated]
      properties:
        id: { type: string }
        name: { type: string }
        cadence: { type: string }
        last_generated: { type: [string, "null"], format: date-time }

    Fairness:
      type: object
      required: [segments, overall_fp_rate]
      properties:
        overall_fp_rate: { type: number }
        segments:
          type: array
          items:
            type: object
            properties:
              segment: { type: string }
              accounts: { type: integer }
              flagged: { type: integer }
              false_positive_rate: { type: number }

    # ── Administration ────────────────────────────────────────
    AdminUser:
      type: object
      required: [id, email, name, role, disabled, mfa_active]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        mfa_active: { type: boolean }
        created_at: { type: string, format: date-time }

    UserInvite:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        temp_password: { type: string, description: "Optional initial password; user re-enrols MFA on first login." }

    UserUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        force_mfa_reset: { type: boolean }

    # ── Simulator ─────────────────────────────────────────────
    ScenarioControl:
      type: object
      required: [command]
      properties:
        command: { type: string, enum: [load, start, pause, reset] }
        scenario: { type: string, description: "Campaign name (YAML file stem), required for load." }
        seed: { type: integer }

    SimStatus:
      type: object
      required: [state, scenario, seed, emitted, tx_per_sec]
      properties:
        state: { type: string, enum: [idle, loaded, running, paused] }
        scenario: { type: [string, "null"] }
        seed: { type: [integer, "null"] }
        emitted: { type: integer, description: "Events emitted so far." }
        tx_per_sec: { type: number }
        available_scenarios:
          type: array
          items: { type: string }

security:
  - bearerAuth: []
