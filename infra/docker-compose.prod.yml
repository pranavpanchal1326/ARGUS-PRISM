version: "3.9"

services:
  api:
    # Production overrides for API service
    # - Remove --reload flag
    # - Use production workers count
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - ENVIRONMENT=production
