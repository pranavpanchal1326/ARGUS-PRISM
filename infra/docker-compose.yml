# ARGUS-PRISM V3 — full local stack.
#   docker compose -f infra/docker-compose.yml up --build
#
# Brings up every datastore the platform needs plus the API. The frontend
# (Pranav) runs separately with `npm run dev`. Ollama is optional (chatbot).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prismdb
    ports: ["5432:5432"]
    volumes: ["prism_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prismdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/prism1234
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["prism_neo4j:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["prism_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["prism_ollama:/root/.ollama"]
    profiles: ["assistant"]   # started only with: --profile assistant

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      POSTGRES_URL: postgresql+psycopg://prism:prism@postgres:5432/prismdb
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  prism_pg:
  prism_neo4j:
  prism_redis:
  prism_ollama:
